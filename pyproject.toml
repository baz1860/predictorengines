# Project scaffolding introduced in refactor Phase 0 (see docs/REFACTOR_PLAN.md).
#
# This file currently provides dependency declarations and tool configuration only.
# A build-system / installable package layout is intentionally deferred to Phases 2-3,
# where the flat root modules and per-sport packages are restructured under
# src/predictors/. Until then, the canonical test runner is `python run_checks.py`,
# which isolates each suite in its own subprocess (necessary today because several
# engines share generic module names — edge.py, predictor.py, model.py — and collide
# under flat collection; see PHASE0 baseline notes).

[project]
name = "predictors"
version = "0.0.0"
description = "Multi-sport prediction and betting-edge engines (World Cup soccer, club soccer, college football, golf, tennis, NHL) with a web app layer."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "requests",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "pywebview>=5.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
# `testpaths = ["tests"]` used to point at a directory with NO test files, so
# the standard `pytest` command collected zero tests and exited green-ish —
# the root conftest.py false-green guard never ran, and real failures stayed
# hidden. Every real suite lives at the repo root; "." collects them.
#
# "." RECURSES, though, and `scripts/` holds two CLI analysis programs named
# `form_forward_test.py` ("forward test" the experiment, not a pytest module).
# Neither defines a single test function, but their identical basenames give
# both the module name `form_forward_test` under pytest's prepend import mode,
# which aborts the ENTIRE run with "import file mismatch". Excluding scripts/
# drops zero tests and removes the collision. norecursedirs REPLACES pytest's
# defaults, so the standard entries are repeated here.
addopts = "-ra"
testpaths = ["."]
norecursedirs = [
    "scripts",
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Conservative starter set; tighten in later phases.
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length handled by formatter; many data tables exceed it
