name: Golf integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths:
      - "golf/**"
      - "test_golf*.py"
      - ".github/workflows/golf-integrity.yml"

permissions:
  contents: read

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy pandas scipy requests pytest
      - name: Check authoritative history and fitted model
        run: python -m golf.integrity
      - name: Run golf regression tests
        run: python -m pytest -q test_golf*.py
